<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UX Encyclopedia</title><style>body{margin:0;font:17px/1.65 Arial;color:#1d1e22}header{padding:20px 5%;border-bottom:1px solid #e8e5e1;color:#b85d45;font-weight:bold}main{max-width:1200px;margin:auto;padding:36px 5%;display:grid;grid-template-columns:280px 1fr;gap:45px}.mod{border-bottom:1px solid #e8e5e1;padding:10px;cursor:pointer}.mod:hover{color:#b85d45}.list button{display:block;width:100%;text-align:left;padding:9px;border:0;border-bottom:1px solid #eee;background:white;cursor:pointer}article{max-width:760px}h1{font-size:48px;line-height:1;letter-spacing:-.05em}.ey{font-size:12px;color:#b85d45;font-weight:bold;letter-spacing:.1em}.box{background:#f7f5f2;border-radius:12px;padding:22px;margin:20px 0}.thread{border-left:3px solid #b85d45;padding:12px 16px}@media(max-width:700px){main{grid-template-columns:1fr}}</style><header>UX Encyclopedia / Course library</header><main><aside id="nav"></aside><article id="page"></article></main><script src="course-data.js"></script><script src="lesson-data.js"></script><script>const nav=document.querySelector('#nav'),page=document.querySelector('#page');function lesson(id,title,mod){let d=lessonMetadata[id];page.innerHTML='<div class="ey">'+mod+' · '+id+'</div><h1>'+title+'</h1><div class="box"><b>Anchor case</b><p>This lesson opens with a concrete situation about '+d.concepts+', then explains the underlying mechanism and the implications for product decisions.</p></div><h2>Core lesson</h2><p>Core concepts: '+d.concepts+'. This chapter is grounded in '+d.sources+' and connects the concept to a user’s goal, context, and wider system outcome.</p><div class="thread"><b>Course thread:</b> This lesson carries the vocabulary and evidence from earlier lessons into the next decision in the path.</div><div class="box"><div class="ey">Senior lens</div><p>Evaluate the evidence, operational constraint, metric, and ethical trade-off that could change the appropriate design response.</p></div><h2>Train your UX eye</h2><p>'+d.ux_eye+'</p><h2>Sources</h2><p>'+d.sources+'</p>'}function render(mid){nav.innerHTML='';Object.entries(courseIndex).forEach(([id,m])=>{let x=document.createElement('div');x.className='mod';x.innerHTML='<small>'+id+'</small><br><b>'+m.name+'</b>';x.onclick=()=>render(id);nav.append(x);if(id===mid){let l=document.createElement('div');l.className='list';m.lessons.forEach(([i,t])=>{let b=document.createElement('button');b.textContent=i+' · '+t;b.onclick=()=>lesson(i,t,id);l.append(b)});nav.append(l);lesson(m.lessons[0][0],m.lessons[0][1],id)}})}render('M01');</script>
