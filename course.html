<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UX Encyclopedia — Course</title><style>
:root{--ink:#1d1c1a;--paper:#f7f1e7;--card:#fffdf8;--line:#cec5b7;--red:#c94f38;--blue:#1554c0;--yellow:#efb72f;--sage:#819078;--muted:#686158}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.62}a{color:inherit}header{position:sticky;top:0;z-index:5;background:#1d1c1af4;color:#fff;border-bottom:1px solid #000;display:flex;align-items:center;justify-content:space-between;padding:14px max(4vw,22px)}.brand{font-weight:900;letter-spacing:-.04em;text-decoration:none;font-size:20px}.brand i{font-style:normal;color:#f06a50}.header-right{display:flex;gap:22px;align-items:center}.project-link{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;text-decoration:none;color:#ffe18a}.project-link:hover{color:white}.progress{font-size:11px;font-weight:800;color:#ffffffa8;letter-spacing:.09em;text-transform:uppercase}main{max-width:1420px;margin:auto;display:grid;grid-template-columns:290px minmax(0,800px);gap:72px;padding:45px max(4vw,22px) 100px}.sidebar{position:sticky;top:72px;align-self:start;max-height:calc(100vh - 95px);overflow:auto;padding-right:14px}.module{border-top:1px solid var(--line);padding:13px 0}.module:last-child{border-bottom:1px solid var(--line)}.module button{appearance:none;background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;color:var(--ink);font-weight:800;line-height:1.25}.module button:hover,.module button.active{color:var(--red)}.module small{display:block;color:var(--red);font-size:10px;font-weight:900;letter-spacing:.11em;margin-bottom:3px}.lessons{padding:8px 0 0}.lesson-link{display:block;padding:6px 0;color:#59534c;text-decoration:none;font-size:13px;line-height:1.3}.lesson-link:hover,.lesson-link.active{color:var(--red);font-weight:800}.lesson-link.active:before{content:'●';font-size:9px;color:var(--red);margin-right:6px}article{min-width:0}#loading{padding:80px 0;font-weight:bold}.eyebrow{font-size:11px;color:var(--red);font-weight:900;letter-spacing:.13em;text-transform:uppercase}.lesson h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(45px,6vw,75px);line-height:.95;letter-spacing:-.06em;margin:10px 0 28px}.lesson h2{font-family:Georgia,'Times New Roman',serif;font-size:31px;line-height:1.08;letter-spacing:-.035em;margin:50px 0 14px}.lesson h3{font-size:20px;line-height:1.2;margin:31px 0 10px}.lesson p{font-size:19px;margin:0 0 22px}.lesson ul,.lesson ol{padding-left:24px;margin:0 0 24px}.lesson li{margin:8px 0;font-size:18px}.lesson a{color:#9d3d2d;text-decoration-thickness:1px}.case-thread{display:grid;grid-template-columns:88px 1fr;background:var(--card);border:1px solid var(--line);box-shadow:7px 7px 0 var(--stage,#efb72f);margin:4px 0 46px}.case-mark{background:var(--stage,#efb72f);display:grid;place-items:center;min-height:150px;font-family:Georgia,serif;font-size:38px;color:var(--ink);position:relative}.case-mark:after{content:'';position:absolute;width:54px;border-top:3px solid var(--red);right:-27px;bottom:24px;transform:rotate(-8deg)}.case-copy{padding:22px 27px}.case-copy small{display:block;font-weight:900;letter-spacing:.11em;color:var(--red);margin-bottom:6px}.case-copy h2{font-family:Arial,sans-serif;font-size:18px;letter-spacing:-.01em;margin:0 0 7px}.case-copy p{font-size:16px;line-height:1.48;margin:0;color:#514c45}.case-copy a{display:inline-block;margin-top:10px;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;text-decoration:none}.lesson h2.anchor,.lesson h2.thread,.lesson h2.senior-head,.lesson h2.eye-head{font-family:Arial,sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:13px;font-weight:900}.lesson h2.anchor{background:var(--blue);color:#fff;margin:45px 0 0;padding:18px 22px 7px}.lesson h2.anchor+p{background:var(--blue);color:#fff;padding:0 22px 20px;margin:0 0 32px;font-family:Georgia,serif;font-size:20px}.lesson h2.thread{border-left:5px solid var(--red);padding:16px 20px 0;margin-bottom:0;background:var(--card)}.lesson h2.thread+p{border-left:5px solid var(--red);padding:6px 20px 18px;background:var(--card);font-size:17px}.lesson h2.senior-head{border:1px solid var(--line);border-bottom:0;margin-bottom:0;padding:20px 22px 5px;color:var(--red);background:var(--card)}.lesson h2.senior-head+p{border:1px solid var(--line);border-top:0;padding:4px 22px 20px;margin-top:0;background:var(--card);font-size:18px}.lesson h2.eye-head{border-top:3px solid var(--ink);padding-top:22px}.lesson h2.refs{font-family:Arial,sans-serif;font-size:18px;border-top:1px solid var(--line);padding-top:24px}.footer-nav{border-top:1px solid var(--line);margin-top:52px;padding-top:20px;display:flex;justify-content:space-between;gap:20px}.footer-nav button{border:2px solid var(--ink);background:var(--card);padding:11px 15px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 var(--yellow)}.footer-nav button:hover:not(:disabled){background:var(--ink);color:#fff}.footer-nav button:disabled{opacity:.32;cursor:not-allowed}@media(max-width:870px){header{position:static}.progress{display:none}main{display:block;padding-top:26px}.sidebar{position:static;max-height:none;margin-bottom:30px}.module{padding:10px 0}.lessons{display:none}.module.open .lessons{display:block}.lesson h1{font-size:49px}.lesson p{font-size:18px}}@media(max-width:540px){.project-link{display:none}.case-thread{grid-template-columns:1fr}.case-mark{min-height:62px}.case-mark:after{display:none}}
.lesson blockquote{margin:28px 0;padding:18px 24px;border-left:5px solid var(--yellow);background:var(--card);font-family:Georgia,'Times New Roman',serif}.lesson blockquote p{margin:0;font-size:20px}.table-wrap{overflow-x:auto;margin:28px 0;border:1px solid var(--line);background:var(--card)}.lesson table{width:100%;border-collapse:collapse;font-size:15px;line-height:1.4}.lesson th,.lesson td{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.lesson th{background:#eee5d7;font-size:12px;text-transform:uppercase;letter-spacing:.05em}.lesson tr:last-child td{border-bottom:0}.lesson th:last-child,.lesson td:last-child{border-right:0}
</style></head><body><header><a class="brand" href="index.html">UX <i>ENCYCLOPEDIA</i></a><div class="header-right"><a class="project-link" href="case.html">Follow the CarePath case →</a><div class="progress" id="progress">204 lessons · 17 stages</div></div></header><main><nav class="sidebar" id="nav" aria-label="Course lessons"></nav><article id="page"><div id="loading">Opening the complete lesson library…</div></article></main><script src="course-204-data.js"></script><script>
const nav=document.querySelector('#nav'),page=document.querySelector('#page'),progressEl=document.querySelector('#progress');let courseIndex={},chapters={};
const stages={M01:['①','frame what a good healthcare experience should accomplish before proposing features','experience brief','#efb72f'],M02:['◉','find where attention, memory, movement, emotion, and time make the journey harder','human-capability audit','#7fa58b'],M03:['↳','model the real work, decisions, handoffs, and mental models behind an appointment','workflow model','#e78059'],M04:['⌕','plan and conduct research that can change the team’s decision','evidence plan','#6e9ed6'],M05:['↻','turn customer contact and assumption testing into a continuous team habit','discovery backlog','#efb72f'],M06:['≋','synthesise messy evidence without erasing contradiction or uncertainty','evidence map','#7fa58b'],M07:['⌘','structure services, records, labels, navigation, and search so people can find their next move','information architecture','#e78059'],M08:['“”','make every instruction, status, error, and handoff understandable in context','content system','#6e9ed6'],M09:['✥','design interaction patterns for booking, changing, paying, collaborating, and recovering','interaction model','#efb72f'],M10:['▦','turn repeated decisions into an accessible, governed design system','CarePath design system','#7fa58b'],M11:['∞','align the frontstage journey with staff work, policy, capacity, and operational reality','service blueprint','#e78059'],M12:['△','prototype the riskiest assumptions and evaluate them at the right fidelity','evaluation record','#6e9ed6'],M13:['⌁','define trustworthy measures and experiments without reducing care to conversion','measurement plan','#efb72f'],M14:['◎','find exclusion, redistribute power, protect consent, and make access operational','inclusion and harm register','#7fa58b'],M15:['✦','decide where AI helps, where it should defer, and how people retain control and recourse','human–AI operating model','#e78059'],M16:['◆','connect the evidence to strategy, delivery, rollout, governance, and organisational influence','product strategy','#6e9ed6'],M17:['✓','integrate the entire case, stress-test trade-offs, and defend the final direction','defensible case study','#efb72f']};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
function headingClass(t){t=t.toLowerCase();if(t==='anchor case')return'anchor';if(t==='course thread')return'thread';if(t.includes('senior lens'))return'senior-head';if(t.includes('train your ux eye'))return'eye-head';if(t==='references')return'refs';return''}
function markdown(md){
  const lines=md.split(/\r?\n/);let out='',list='',i=0;
  const closeList=()=>{if(list){out+='</'+list+'>';list=''}};
  const cells=line=>line.replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
  while(i<lines.length){
    const l=lines[i].trim();
    if(!l){closeList();i++;continue}
    if(l==='---'||l.startsWith('# ')){i++;continue}
    const h=l.match(/^(#{2,3})\s+(.+)/);
    if(h){closeList();const tag=h[1].length===2?'h2':'h3',label=h[2].toLowerCase()==='anchor case'?'Concept in the wild':h[2];out+='<'+tag+' class="'+headingClass(h[2])+'">'+inline(label)+'</'+tag+'>';i++;continue}
    if(/^\|/.test(l)&&/^\|?\s*:?-{3,}/.test((lines[i+1]||'').trim().replace(/^\|/,''))){
      closeList();const heads=cells(l);i+=2;const rows=[];while(i<lines.length&&/^\|/.test(lines[i].trim())){rows.push(cells(lines[i].trim()));i++}
      out+='<div class="table-wrap"><table><thead><tr>'+heads.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+inline(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';continue
    }
    if(l.startsWith('>')){closeList();const quote=[];while(i<lines.length&&lines[i].trim().startsWith('>')){quote.push(lines[i].trim().replace(/^>\s?/,''));i++}out+='<blockquote><p>'+inline(quote.join(' '))+'</p></blockquote>';continue}
    const li=l.match(/^[-*]\s+(.+)/),oi=l.match(/^\d+\.\s+(.+)/);
    if(li||oi){const want=oi?'ol':'ul';if(list&&list!==want)closeList();if(list!==want){out+='<'+want+'>';list=want}out+='<li>'+inline((li||oi)[1])+'</li>';i++;continue}
    closeList();const para=[l];i++;while(i<lines.length){const next=lines[i].trim();if(!next||/^(#{1,3})\s+/.test(next)||/^[-*]\s+/.test(next)||/^\d+\.\s+/.test(next)||next.startsWith('>')||next.startsWith('|'))break;para.push(next);i++}out+='<p>'+inline(para.join(' '))+'</p>';
  }
  closeList();return out
}
function renderNav(current){nav.innerHTML='';Object.entries(courseIndex).forEach(([mid,m],i)=>{const section=document.createElement('section');section.className='module '+(m.lessons.some(x=>x[0]===current)?'open':'');const b=document.createElement('button');b.setAttribute('aria-expanded',section.classList.contains('open'));b.innerHTML='<small>STAGE '+String(i+1).padStart(2,'0')+' · '+m.lessons.length+' LESSONS</small>'+esc(m.name);b.onclick=()=>{section.classList.toggle('open');b.setAttribute('aria-expanded',section.classList.contains('open'))};section.append(b);const list=document.createElement('div');list.className='lessons';m.lessons.forEach(([id,title])=>{const a=document.createElement('a');a.className='lesson-link '+(id===current?'active':'');a.href='#'+id;a.textContent=id+' · '+title;a.onclick=e=>{e.preventDefault();history.replaceState(null,'','#'+id);show(id);scrollTo(0,0)};list.append(a)});section.append(list);nav.append(section)})}
function find(id){for(const [mid,m] of Object.entries(courseIndex)){const pos=m.lessons.findIndex(x=>x[0]===id);if(pos>-1)return{mid,m,title:m.lessons[pos][1],pos}}}
function caseCard(x,at){const s=stages[x.mid],stage=Number(x.mid.slice(1));return'<section class="case-thread" style="--stage:'+s[3]+'"><div class="case-mark" aria-hidden="true">'+s[0]+'</div><div class="case-copy"><small>CAREPATH · STEP '+(at+1)+' OF 204 · STAGE '+stage+'</small><h2>Apply “'+esc(x.title)+'” to the same problem</h2><p>Alex uses this lesson to '+s[1]+'. The decision is added to the <strong>'+s[2]+'</strong>, so the project carries evidence forward instead of restarting in every chapter.</p><a href="case.html#'+x.mid+'">See the whole case process →</a></div></section>'}
function show(id){const x=find(id);if(!x||!chapters[id])return;const all=Object.values(courseIndex).flatMap(m=>m.lessons),at=all.findIndex(x=>x[0]===id);progressEl.textContent='Step '+(at+1)+' of '+all.length+' · '+x.mid;page.innerHTML='<div class="lesson"><div class="eyebrow">'+x.mid+' · '+id+'</div><h1>'+esc(x.title)+'</h1>'+caseCard(x,at)+markdown(chapters[id])+'<div class="footer-nav"><button id="prev" '+(at===0?'disabled':'')+'>← Previous</button><button id="next" '+(at===all.length-1?'disabled':'')+'>Next →</button></div></div>';const prevButton=document.querySelector('#prev'),nextButton=document.querySelector('#next');if(at>0)prevButton.onclick=()=>go(all[at-1][0]);if(at<all.length-1)nextButton.onclick=()=>go(all[at+1][0]);renderNav(id)}
function go(id){history.replaceState(null,'','#'+id);show(id);scrollTo(0,0)}async function unpack(){const bytes=Uint8Array.from(atob(window.course204Gzip),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(stream).text())}unpack().then(d=>{courseIndex=d.index;chapters=d.chapters;show(location.hash.slice(1)||'UX-001')}).catch(e=>{page.innerHTML='<h1>Lesson library could not open.</h1><p>Please refresh in a modern browser.</p>';console.error(e)});
</script></body></html>
