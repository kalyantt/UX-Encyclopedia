</style></head><body><header><a class="brand" href="index.html">UX <i>ENCYCLOPEDIA</i></a><div class="header-right"><a class="project-link" href="case.html">Follow the CarePath case →</a><div class="progress" id="progress">204 lessons · 17 stages</div></div></header><main><nav class="sidebar" id="nav" aria-label="Course lessons"></nav><article id="page"><div id="loading">Opening the lesson…</div></article></main><script src="course-204-data.js?v=20260910a"></script><script>
const nav=document.querySelector('#nav'),page=document.querySelector('#page'),progressEl=document.querySelector('#progress');let courseIndex={},chapters={},comics={};
const stages={M01:['①','frame what a good healthcare experience should accomplish before proposing features','experience brief','#efb72f'],M02:['◉','find where attention, memory, movement, emotion, and time make the journey harder','human-capability audit','#7fa58b'],M03:['↳','model the real work, decisions, handoffs, and mental models behind an appointment','workflow model','#e78059'],M04:['⌕','plan and conduct research that can change the team’s decision','evidence plan','#6e9ed6'],M05:['↻','turn customer contact and assumption testing into a continuous team habit','discovery backlog','#efb72f'],M06:['≋','synthesise messy evidence without erasing contradiction or uncertainty','evidence map','#7fa58b'],M07:['⌘','structure services, records, labels, navigation, and search so people can find their next move','information architecture','#e78059'],M08:['“”','make every instruction, status, error, and handoff understandable in context','content system','#6e9ed6'],M09:['✥','design interaction patterns for booking, changing, paying, collaborating, and recovering','interaction model','#efb72f'],M10:['▦','turn repeated decisions into an accessible, governed design system','CarePath design system','#7fa58b'],M11:['∞','align the frontstage journey with staff work, policy, capacity, and operational reality','service blueprint','#e78059'],M12:['△','prototype the riskiest assumptions and evaluate them at the right fidelity','evaluation record','#6e9ed6'],M13:['⌁','define trustworthy measures and experiments without reducing care to conversion','measurement plan','#efb72f'],M14:['◎','find exclusion, redistribute power, protect consent, and make access operational','inclusion and harm register','#7fa58b'],M15:['✦','decide where AI helps, where it should defer, and how people retain control and recourse','human and AI operating model','#e78059'],M16:['◆','connect the evidence to strategy, delivery, rollout, governance, and organisational influence','product strategy','#6e9ed6'],M17:['✓','integrate the entire case, stress-test trade-offs, and defend the final direction','defensible case study','#efb72f']};
const visuals={
  M01:['assets/module-01-foundations.jpg','Notice the person, their goal, and the setting before judging the screen.'],
  M02:['assets/module-02-perception.jpg','Watch what wins attention, what disappears, and what happens when time is short.'],
  M03:['assets/module-03-context.jpg','Follow the whole task across place, time, channels, interruptions, and handoffs.'],
  M04:['assets/module-04-research.jpg','Follow one real moment from observation to evidence, then into a decision.'],
  M05:['assets/module-05-discovery.jpg','See discovery as a living loop of contact, assumptions, tests, and changed choices.'],
  M06:['assets/module-06-synthesis.jpg','Trace how scattered notes become patterns without losing doubt or contradiction.'],
  M07:['assets/module-07-information.jpg','See how labels, relationships, and paths turn scattered content into something people can use.'],
  M08:['assets/module-08-content.jpg','Read the words as part of the service, across states, channels, stress, and recovery.'],
  M09:['assets/module-09-interaction.jpg','Watch the action, response, and recovery across devices and abilities.'],
  M10:['assets/module-10-systems.jpg','Look for the shared decisions, contribution rules, and quality checks behind each component.'],
  M11:['assets/module-11-service.jpg','Look past the interface to the staff, policy, capacity, and handoffs behind it.'],
  M12:['assets/module-12-evaluation.jpg','Match the prototype and evaluation method to the risk the team needs to understand.'],
  M13:['assets/module-13-metrics.jpg','Keep human outcomes beside the chart, the experiment, and every guardrail.'],
  M14:['assets/module-14-inclusion.jpg','Keep access, power, participation, and recovery in the same picture.'],
  M15:['assets/module-15-ai.jpg','Notice where automation helps, where it should defer, and who can put things right.'],
  M16:['assets/module-16-strategy.jpg','Connect evidence to a real decision, owner, trade-off, and next move.'],
  M17:['assets/module-17-capstone.jpg','Bring the full case together and make every claim, risk, and decision defensible.'],
};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
function headingClass(t){t=t.toLowerCase();if(t==='anchor case')return'anchor';if(t==='course thread')return'thread';if(t.includes('senior lens'))return'senior-head';if(t.includes('train your ux eye'))return'eye-head';if(t==='references')return'refs';return''}
function comicStrip(x){const comic=comics[x.id];if(!comic)return'';const visual=visuals[x.mid],s=stages[x.mid],panels=[['The CarePath moment',comic.scene],['What Alex notices',comic.notice],['The design move',comic.change]];return'<section class="lesson-comic" style="--comic-color:'+s[3]+'" aria-label="CarePath comic for '+esc(x.title)+'"><div class="comic-heading">CarePath, drawn out</div><div class="comic-grid">'+panels.map((panel,i)=>'<figure class="comic-panel"><div class="comic-frame"><img src="'+visual[0]+'" alt="" aria-hidden="true" decoding="async"><span class="comic-number">'+(i+1)+'</span></div><div class="comic-bubble">'+esc(panel[1])+'</div><figcaption class="comic-label">'+panel[0]+'</figcaption></figure>').join('')+'</div></section>'}
function markdown(md,x){
  const lines=md.split(/\r?\n/);let out='',list='',i=0,inCarePath=false,comicAdded=false;
  const closeList=()=>{if(list){out+='</'+list+'>';list=''}};
  const addComic=()=>{if(inCarePath&&!comicAdded){closeList();out+=comicStrip(x);comicAdded=true;inCarePath=false}};
  const cells=line=>line.replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
  while(i<lines.length){
    const l=lines[i].trim();
    if(!l){closeList();i++;continue}
    if(l==='---'||l.startsWith('# ')){i++;continue}
    const h=l.match(/^(#{2,3})\s+(.+)/);
    if(h){if(h[1].length===2&&inCarePath)addComic();closeList();const tag=h[1].length===2?'h2':'h3',label=h[2].toLowerCase()==='anchor case'?'Concept in the wild':h[2];out+='<'+tag+' class="'+headingClass(h[2])+'">'+inline(label)+'</'+tag+'>';if(h[1].length===2&&!comicAdded&&/carepath/i.test(h[2]))inCarePath=true;i++;continue}
    if(/^\|/.test(l)&&/^\|?\s*:?-{3,}/.test((lines[i+1]||'').trim().replace(/^\|/,''))){
      closeList();const heads=cells(l);i+=2;const rows=[];while(i<lines.length&&/^\|/.test(lines[i].trim())){rows.push(cells(lines[i].trim()));i++}
      out+='<div class="table-wrap"><table><thead><tr>'+heads.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+inline(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';continue
    }
    if(l.startsWith('>')){closeList();const quote=[];while(i<lines.length&&lines[i].trim().startsWith('>')){quote.push(lines[i].trim().replace(/^>\s?/,''));i++}out+='<blockquote><p>'+inline(quote.join(' '))+'</p></blockquote>';continue}
    const li=l.match(/^[-*]\s+(.+)/),oi=l.match(/^\d+\.\s+(.+)/);
    if(li||oi){const want=oi?'ol':'ul';if(list&&list!==want)closeList();if(list!==want){out+='<'+want+'>';list=want}out+='<li>'+inline((li||oi)[1])+'</li>';i++;continue}
    closeList();const para=[l];i++;while(i<lines.length){const next=lines[i].trim();if(!next||/^(#{1,3})\s+/.test(next)||/^[-*]\s+/.test(next)||/^\d+\.\s+/.test(next)||next.startsWith('>')||next.startsWith('|'))break;para.push(next);i++}out+='<p>'+inline(para.join(' '))+'</p>';
  }
  closeList();addComic();return out
}
function renderNav(current){nav.innerHTML='';Object.entries(courseIndex).forEach(([mid,m],i)=>{const section=document.createElement('section');section.className='module '+(m.lessons.some(x=>x[0]===current)?'open':'');const b=document.createElement('button');b.className='module-toggle';b.setAttribute('aria-expanded',section.classList.contains('open'));b.innerHTML='<span><small>STAGE '+String(i+1).padStart(2,'0')+' · '+m.lessons.length+' LESSONS</small>'+esc(m.name)+'</span>';b.onclick=()=>{const willOpen=!section.classList.contains('open');nav.querySelectorAll('.module.open').forEach(openSection=>{openSection.classList.remove('open');openSection.querySelector('.module-toggle').setAttribute('aria-expanded','false')});if(willOpen){section.classList.add('open');b.setAttribute('aria-expanded','true')}};section.append(b);const list=document.createElement('div');list.className='lessons';m.lessons.forEach(([id,title])=>{const a=document.createElement('a');a.className='lesson-link '+(id===current?'active':'');a.href='#'+id;a.textContent=id+' · '+title;a.onclick=e=>{e.preventDefault();history.replaceState(null,'','#'+id);show(id);scrollTo(0,0)};list.append(a)});section.append(list);nav.append(section)})}
function find(id){for(const [mid,m] of Object.entries(courseIndex)){const pos=m.lessons.findIndex(x=>x[0]===id);if(pos>-1)return{mid,m,title:m.lessons[pos][1],pos}}}
function caseCard(x,at){const s=stages[x.mid],stage=Number(x.mid.slice(1)),lines=[['Alex now uses this idea to ',' The result becomes part of the '],['Here, Alex will ',' This work goes into the '],['For CarePath, the next move is to ',' Alex records it in the '],['This lesson changes the case in a practical way. Alex will ',' The decision stays visible in the ']],line=lines[at%lines.length],ending=at===203?'. This completes the case study.':', ready for the lessons that follow.';return'<section class="case-thread" style="--stage:'+s[3]+'"><div class="case-mark" aria-hidden="true">'+s[0]+'</div><div class="case-copy"><small>CAREPATH · LESSON '+(at+1)+' OF 204 · STAGE '+stage+'</small><h2>CarePath, one step further</h2><p>'+line[0]+s[1]+'.'+line[1]+'<strong>'+s[2]+'</strong>'+ending+'</p><a href="case.html#'+x.mid+'">See CarePath from the beginning →</a></div></section>'}
function show(id){const x=find(id);if(!x||!chapters[id])return;x.id=id;const all=Object.values(courseIndex).flatMap(m=>m.lessons),at=all.findIndex(x=>x[0]===id);progressEl.textContent='Lesson '+(at+1)+' of '+all.length+' · '+x.mid;page.innerHTML='<div class="lesson"><div class="eyebrow">'+x.mid+' · '+id+'</div><h1>'+esc(x.title)+'</h1>'+caseCard(x,at)+markdown(chapters[id],x)+'<div class="footer-nav"><button id="prev" '+(at===0?'disabled':'')+'>← Previous</button><button id="next" '+(at===all.length-1?'disabled':'')+'>Next →</button></div></div>';const prevButton=document.querySelector('#prev'),nextButton=document.querySelector('#next');if(at>0)prevButton.onclick=()=>go(all[at-1][0]);if(at<all.length-1)nextButton.onclick=()=>go(all[at+1][0]);renderNav(id)}
function go(id){history.replaceState(null,'','#'+id);show(id);scrollTo(0,0)}async function unpack(){const bytes=Uint8Array.from(atob(window.course204Gzip),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(stream).text())}unpack().then(d=>{courseIndex=d.index;chapters=d.chapters;comics=d.comics||{};show(location.hash.slice(1)||'UX-001')}).catch(e=>{page.innerHTML='<h1>Lesson library could not open.</h1><p>Please refresh in a modern browser.</p>';console.error(e)});
