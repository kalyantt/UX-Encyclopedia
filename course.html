<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UX Encyclopedia — Course</title><style>
:root{--ink:#202124;--paper:#fff;--wash:#f4f2ee;--line:#dedbd5;--rust:#c75b42;--rust-dark:#9d4230;--muted:#716e69}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.62}a{color:inherit}header{position:sticky;top:0;z-index:5;background:#fffffff2;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:15px max(5vw,24px)}.brand{font-weight:900;letter-spacing:-.04em;text-decoration:none;font-size:20px}.brand i{font-style:normal;color:var(--rust)}.progress{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}main{max-width:1370px;margin:auto;display:grid;grid-template-columns:290px minmax(0,780px);gap:70px;padding:46px max(5vw,24px) 100px}.sidebar{position:sticky;top:72px;align-self:start;max-height:calc(100vh - 95px);overflow:auto;padding-right:12px}.module{border-top:1px solid var(--line);padding:13px 0}.module:last-child{border-bottom:1px solid var(--line)}.module button{appearance:none;background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;color:var(--ink);font-weight:800;line-height:1.25}.module button:hover,.module button.active{color:var(--rust-dark)}.module small{display:block;color:var(--rust);font-size:11px;font-weight:900;letter-spacing:.1em;margin-bottom:3px}.lessons{padding:8px 0 0}.lesson-link{display:block;padding:6px 0;color:#595752;text-decoration:none;font-size:13px;line-height:1.3}.lesson-link:hover,.lesson-link.active{color:var(--rust-dark);font-weight:800}.lesson-link.active:before{content:'●';font-size:9px;color:var(--rust);margin-right:6px}article{min-width:0}#loading{padding:80px 0;font-weight:bold}.eyebrow{font-size:12px;color:var(--rust);font-weight:900;letter-spacing:.12em;text-transform:uppercase}.lesson h1{font-size:clamp(42px,6vw,74px);line-height:.94;letter-spacing:-.065em;margin:10px 0 30px}.lesson h2{font-size:30px;line-height:1.06;letter-spacing:-.042em;margin:50px 0 13px}.lesson h3{font-size:21px;line-height:1.2;margin:31px 0 10px}.lesson p{font-size:19px;margin:0 0 22px}.lesson ul,.lesson ol{padding-left:24px;margin:0 0 24px}.lesson li{margin:8px 0;font-size:18px}.lesson a{color:var(--rust-dark);text-decoration-thickness:1px}.callout{background:var(--wash);border-left:6px solid var(--rust);padding:20px 24px;margin:38px 0}.callout h2{font-size:14px;letter-spacing:.09em;text-transform:uppercase;color:var(--rust-dark);margin:0 0 8px}.callout p{font-size:18px;margin:0}.senior{border:1px solid var(--line);border-radius:3px;padding:23px 26px;margin:42px 0}.senior h2{color:var(--rust-dark);font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 9px}.senior p{font-size:18px;margin:0}.eye{margin-top:48px;padding-top:24px;border-top:2px solid var(--ink)}.eye h2{margin:0 0 10px}.footer-nav{border-top:1px solid var(--line);margin-top:52px;padding-top:20px;display:flex;justify-content:space-between;gap:20px}.footer-nav button{border:1px solid var(--ink);background:white;padding:10px 14px;font-weight:800;cursor:pointer}.footer-nav button:hover:not(:disabled){background:var(--ink);color:#fff}.footer-nav button:disabled{opacity:.35;cursor:not-allowed}@media(max-width:850px){header{position:static}.progress{display:none}main{display:block;padding-top:26px}.sidebar{position:static;max-height:none;margin-bottom:30px}.module{padding:10px 0}.lessons{display:none}.module.open .lessons{display:block}.lesson h1{font-size:48px}.lesson p{font-size:18px}}
</style></head><body><header><a class="brand" href="index.html">UX <i>ENCYCLOPEDIA</i></a><div class="progress" id="progress">204 lessons · 17 modules</div></header><main><nav class="sidebar" id="nav" aria-label="Course lessons"></nav><article id="page"><div id="loading">Opening the complete lesson library…</div></article></main><script src="course-204-data.js"></script><script>
const nav=document.querySelector('#nav'),page=document.querySelector('#page');let courseIndex={},chapters={};const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
function markdown(md){let out='',list='';for(const raw of md.split(/\r?\n/)){const l=raw.trim();if(!l){if(list){out+='</'+list+'>';list=''}continue}if(l==='---')continue;if(l.startsWith('# '))continue;const h=l.match(/^(#{2,3})\s+(.+)/);if(h){if(list){out+='</'+list+'>';list=''};const tag=h[1].length===2?'h2':'h3';const text=h[2],klass=/^(Course thread|Anchor case|The senior lens|Senior lens)/i.test(text)?' class="senior-title"':'';out+='<'+tag+klass+'>'+inline(text)+'</'+tag+'>';continue}const li=l.match(/^[-*]\s+(.+)/);const oi=l.match(/^\d+\.\s+(.+)/);if(li||oi){const want=oi?'ol':'ul';if(list&&list!==want)out+='</'+list+'>';if(list!==want){out+='<'+want+'>';list=want}out+='<li>'+inline((li||oi)[1])+'</li>';continue}out+='<p>'+inline(l)+'</p>'}if(list)out+='</'+list+'>';return out}
function decorate(){for(const h of page.querySelectorAll('h2')){const t=h.textContent.toLowerCase();if(t.includes('course thread')||t.includes('anchor case'))h.parentElement.classList.add('has-callout');if(t.includes('senior lens'))h.parentElement.classList.add('has-senior');if(t.includes('train your ux eye'))h.parentElement.classList.add('has-eye')}for(const h of page.querySelectorAll('h2')){const t=h.textContent.toLowerCase();if(t.includes('course thread')||t.includes('anchor case')){h.classList.add('callout-head')}if(t.includes('senior lens'))h.classList.add('senior-head')} }
function renderNav(current){nav.innerHTML='';Object.entries(courseIndex).forEach(([mid,m])=>{const section=document.createElement('section');section.className='module '+(m.lessons.some(x=>x[0]===current)?'open':'');const b=document.createElement('button');b.setAttribute('aria-expanded',section.classList.contains('open'));b.innerHTML='<small>'+mid+' · '+m.lessons.length+' lessons</small>'+esc(m.name);b.onclick=()=>{section.classList.toggle('open');b.setAttribute('aria-expanded',section.classList.contains('open'))};section.append(b);const list=document.createElement('div');list.className='lessons';m.lessons.forEach(([id,title])=>{const a=document.createElement('a');a.className='lesson-link '+(id===current?'active':'');a.href='#'+id;a.textContent=id+' · '+title;a.onclick=e=>{e.preventDefault();history.replaceState(null,'','#'+id);show(id);scrollTo(0,0)};list.append(a)});section.append(list);nav.append(section)})}
function find(id){for(const [mid,m] of Object.entries(courseIndex)){const pos=m.lessons.findIndex(x=>x[0]===id);if(pos>-1)return{mid,m,title:m.lessons[pos][1],pos}}}
function show(id){const x=find(id);if(!x||!chapters[id])return;const all=Object.values(courseIndex).flatMap(m=>m.lessons),at=all.findIndex(x=>x[0]===id);document.querySelector('#progress').textContent='Lesson '+(at+1)+' of '+all.length+' · '+x.mid;page.innerHTML='<div class="lesson"><div class="eyebrow">'+x.mid+' · '+id+'</div><h1>'+esc(x.title)+'</h1>'+markdown(chapters[id])+'<div class="footer-nav"><button id="prev" '+(at===0?'disabled':'')+'>← Previous</button><button id="next" '+(at===all.length-1?'disabled':'')+'>Next →</button></div></div>';if(at>0)document.querySelector('#prev').onclick=()=>{const n=all[at-1][0];history.replaceState(null,'','#'+n);show(n);scrollTo(0,0)};if(at<all.length-1)document.querySelector('#next').onclick=()=>{const n=all[at+1][0];history.replaceState(null,'','#'+n);show(n);scrollTo(0,0)};renderNav(id)}
async function unpack(){const bytes=Uint8Array.from(atob(window.course204Gzip),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(stream).text())}unpack().then(d=>{courseIndex=d.index;chapters=d.chapters;show(location.hash.slice(1)||'UX-001')}).catch(e=>{page.innerHTML='<h1>Lesson library could not open.</h1><p>Please refresh in a modern browser.</p>';console.error(e)});
</script></body></html>
