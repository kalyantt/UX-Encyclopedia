<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UX Encyclopedia — Course</title>
  <style>
    :root{--ink:#202124;--paper:#fff;--wash:#f3f1ed;--line:#dedbd5;--orange:#c75b42;--orange-dark:#9d4230;--muted:#716e69}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.62}a{color:inherit}
    header{position:sticky;top:0;z-index:3;background:#fffffff2;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:15px max(5vw,24px)}.brand{font-weight:900;letter-spacing:-.04em;text-decoration:none;font-size:20px}.brand i{font-style:normal;color:var(--orange)}.progress{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
    main{max-width:1370px;margin:auto;display:grid;grid-template-columns:280px minmax(0,760px);gap:70px;padding:46px max(5vw,24px) 100px}.sidebar{position:sticky;top:72px;align-self:start;max-height:calc(100vh - 95px);overflow:auto;padding-right:12px}.module{border-top:1px solid var(--line);padding:14px 0}.module:last-child{border-bottom:1px solid var(--line)}.module button{appearance:none;background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;color:var(--ink);font-weight:800}.module button:hover,.module button.active{color:var(--orange-dark)}.module small{display:block;color:var(--orange);font-size:11px;font-weight:900;letter-spacing:.1em;margin-bottom:2px}.lessons{padding:8px 0 0}.lesson-link{display:block;padding:7px 0;color:#595752;text-decoration:none;font-size:13px;line-height:1.3}.lesson-link:hover,.lesson-link.active{color:var(--orange-dark);font-weight:800}.lesson-link.active:before{content:'●';font-size:9px;color:var(--orange);margin-right:6px}
    article{min-width:0}#loading{padding:80px 0;font-weight:bold}.eyebrow{font-size:12px;color:var(--orange);font-weight:900;letter-spacing:.12em;text-transform:uppercase}.lesson h1{font-size:clamp(42px,6vw,74px);line-height:.94;letter-spacing:-.065em;margin:10px 0 30px}.anchor{background:var(--wash);border-left:6px solid var(--orange);padding:22px 25px;margin:0 0 42px;font-size:19px;line-height:1.45}.anchor strong{display:block;color:var(--orange-dark);font-size:13px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}.lesson h2{font-size:29px;line-height:1.05;letter-spacing:-.04em;margin:50px 0 12px}.lesson p{font-size:19px;margin:0 0 22px}.lesson h2:nth-of-type(3){border:1px solid var(--line);border-left:5px solid var(--orange);padding:19px 20px 0;margin-top:42px}.lesson h2:nth-of-type(4){color:var(--orange-dark)}.lesson ul{padding-left:21px;margin-top:0}.lesson li{margin:8px 0}.footer-nav{border-top:1px solid var(--line);margin-top:52px;padding-top:20px;display:flex;justify-content:space-between;gap:20px}.footer-nav button{border:1px solid var(--ink);background:white;padding:10px 14px;font-weight:800;cursor:pointer}.footer-nav button:hover{background:var(--ink);color:#fff}@media(max-width:850px){header{position:static}.progress{display:none}main{display:block;padding-top:26px}.sidebar{position:static;max-height:none;margin-bottom:30px}.module{padding:10px 0}.lessons{display:none}.module.open .lessons{display:block}.lesson h1{font-size:48px}.lesson p{font-size:18px}}
  </style>
</head>
<body>
  <header><a class="brand" href="index.html">UX <i>ENCYCLOPEDIA</i></a><div class="progress" id="progress">96 lessons · 16 modules</div></header>
  <main><nav class="sidebar" id="nav" aria-label="Course lessons"></nav><article id="page"><div id="loading">Opening the lesson library…</div></article></main>
  <script src="course-data.js"></script><script src="lesson-content.js"></script>
  <script>
  const nav=document.querySelector('#nav'),page=document.querySelector('#page');let chapters={};
  const escape=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  function markdown(md){const lines=md.split(/\r?\n/);let out='',list=false;for(const raw of lines){const l=raw.trim();if(!l){if(list){out+='</ul>';list=false}continue}if(l.startsWith('# '))continue;if(l.startsWith('## ')){if(list){out+='</ul>';list=false}out+='<h2>'+escape(l.slice(3))+'</h2>';continue}if(l.startsWith('- ')){if(!list){out+='<ul>';list=true}out+='<li>'+escape(l.slice(2))+'</li>';continue}out+='<p>'+escape(l)+'</p>'}return out+(list?'</ul>':'')}
  async function unpack(){const bytes=Uint8Array.from(atob(window.lessonContentGzip),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));chapters=JSON.parse(await new Response(stream).text())}
  function renderNav(current){nav.innerHTML='';Object.entries(courseIndex).forEach(([mid,m])=>{const section=document.createElement('section');section.className='module '+(m.lessons.some(x=>x[0]===current)?'open':'');const heading=document.createElement('button');heading.innerHTML='<small>'+mid+'</small>'+m.name;heading.onclick=()=>{section.classList.toggle('open')};section.append(heading);const list=document.createElement('div');list.className='lessons';m.lessons.forEach(([id,title])=>{const a=document.createElement('a');a.className='lesson-link '+(id===current?'active':'');a.href='#'+id;a.textContent=id+' · '+title;a.onclick=e=>{e.preventDefault();show(id);history.replaceState(null,'','#'+id)};list.append(a)});section.append(list);nav.append(section)})}
  function find(id){for(const [mid,m] of Object.entries(courseIndex)){const hit=m.lessons.find(x=>x[0]===id);if(hit)return {mid,m,title:hit[1],pos:m.lessons.findIndex(x=>x[0]===id)}}}
  function show(id){const x=find(id);if(!x||!chapters[id])return;const global=Object.values(courseIndex).flatMap(m=>m.lessons);const at=global.findIndex(x=>x[0]===id);document.querySelector('#progress').textContent='Lesson '+(at+1)+' of 96 · '+x.mid;page.innerHTML='<div class="lesson"><div class="eyebrow">'+x.mid+' · '+id+'</div><h1>'+escape(x.title)+'</h1>'+markdown(chapters[id])+'<div class="footer-nav"><button id="prev" '+(at===0?'disabled':'')+'>← Previous</button><button id="next" '+(at===95?'disabled':'')+'>Next →</button></div></div>';if(at>0)document.querySelector('#prev').onclick=()=>{const n=global[at-1][0];history.replaceState(null,'','#'+n);show(n);scrollTo(0,0)};if(at<95)document.querySelector('#next').onclick=()=>{const n=global[at+1][0];history.replaceState(null,'','#'+n);show(n);scrollTo(0,0)};renderNav(id)}
  unpack().then(()=>show(location.hash.slice(1)||'UX-001')).catch(err=>{page.innerHTML='<h1>Lesson library could not open.</h1><p>Please use a modern browser, then refresh this page.</p>';console.error(err)});
  </script>
</body></html>
