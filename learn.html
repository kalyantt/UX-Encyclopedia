<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UX Encyclopedia</title><style>
:root{--ink:#1d1e22;--muted:#707074;--accent:#b85d45;--paper:#fff;--soft:#f7f5f2;--line:#e8e5e1}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--paper)}header{max-width:1240px;margin:auto;padding:24px 34px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:800;color:var(--accent);font-size:20px;letter-spacing:-.04em}nav{display:flex;gap:26px;font-size:14px}nav a{text-decoration:none;color:var(--ink)}.hero{max-width:830px;margin:92px auto 66px;text-align:center;padding:0 24px}.eyebrow{color:var(--accent);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(48px,8vw,90px);line-height:.98;letter-spacing:-.07em;margin:14px 0 22px}.hero p{font-size:21px;line-height:1.5;color:#38383c;margin:auto;max-width:680px}.cta{display:inline-block;margin-top:29px;background:var(--ink);color:white;text-decoration:none;padding:15px 23px;border-radius:9px;font-weight:700}.wrap{max-width:1240px;margin:auto;padding:0 34px 88px}.sectionhead{display:flex;justify-content:space-between;align-items:end;border-top:1px solid var(--line);padding-top:22px;margin-bottom:20px}.sectionhead h2{font-size:32px;letter-spacing:-.04em;margin:0}.sectionhead p{color:var(--muted);margin:0}.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.module{border:1px solid var(--line);border-radius:16px;padding:24px;background:#fff}.module.active{background:var(--soft)}.module small{color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.module h3{font-size:22px;line-height:1.15;margin:10px 0}.module p{font-size:14px;color:var(--muted);min-height:40px}.module button{border:0;background:none;padding:0;color:var(--accent);font-weight:800;cursor:pointer}.player{margin-top:42px;padding:36px;background:var(--soft);border-radius:20px;display:grid;grid-template-columns:220px 1fr;gap:42px}.side h3{margin:0 0 10px}.lesson-link{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 0;border-bottom:1px solid var(--line);color:var(--ink);cursor:pointer;font:14px/1.35 Arial}.lesson-link.active{color:var(--accent);font-weight:800}.content{max-width:720px}.content h1{font-size:44px;letter-spacing:-.05em;line-height:1;margin:10px 0 20px}.content h2{margin-top:35px;font-size:26px;letter-spacing:-.03em}.content p,.content li{line-height:1.7}.anchor{padding:22px;background:#f2e7e2;border-radius:13px;margin:22px 0}.thread{border-left:3px solid var(--accent);padding:12px 17px;background:#fff;margin:25px 0}.senior{padding:23px;border:1px solid var(--line);border-radius:13px;background:#fff;margin:28px 0}.empty{padding:40px;color:var(--muted);text-align:center}@media(max-width:800px){header{padding:18px}.hero{margin:55px auto}.wrap{padding:0 18px 60px}.modules{grid-template-columns:1fr}.player{grid-template-columns:1fr;gap:22px}.side{display:flex;overflow:auto;gap:14px}.side h3{display:none}.lesson-link{min-width:170px;border:1px solid var(--line);border-radius:8px;padding:9px}.content h1{font-size:38px}nav{display:none}}
</style></head><body><header><div class="brand">Built for better UX</div><nav><a href="#learn">Learn UX</a><a href="#library">Course library</a><a href="#about">About</a></nav></header><section class="hero"><div class="eyebrow">The UX Encyclopedia</div><h1>Learn how good products actually work.</h1><p>A connected, research-backed UX and product design course. Build judgement, not a collection of definitions.</p><a class="cta" href="#learn">Start learning</a></section><main class="wrap" id="learn"><div class="sectionhead"><h2>Your learning path</h2><p id="progress">12 lessons in production</p></div><div class="modules" id="modules"></div><section class="player" id="library"><aside class="side"><h3 id="moduleTitle">Module 1</h3><div id="lessonList"></div></aside><article class="content" id="content"></article></section></main><script>
const modules=[
 {id:'M01',name:'UX foundations',desc:'What UX is, how quality is judged, and where product experiences really live.',lessons:[['UX-001','What UX is'],['UX-002','Usability is not aesthetic taste'],['UX-003','Experience goals'],['UX-004','Context changes design'],['UX-005','Products are part of services'],['UX-006','The UX quality lens']]},
 {id:'M02',name:'Human perception and action',desc:'Attention, hierarchy, memory, decisions, and forgiving interactions.',lessons:[['UX-007','Your brain does not see everything'],['UX-008','Visual structure is a language'],['UX-009','Attention is a scarce resource'],['UX-010','Recognition beats recall'],['UX-011','Decisions are designed'],['UX-012','Error, recovery, and forgiveness']]},
 ...['Context, tasks, and mental models','Research and evidence','Continuous discovery','Synthesis and influence','Information architecture','Content and interface craft','Design systems','Service design','Prototyping and evaluation','Analytics and experimentation','Accessibility and ethical design','Human-centred AI','Product and organisation','Capstone'].map((name,i)=>({id:'M'+String(i+3).padStart(2,'0'),name,desc:'In production - this module will continue the course thread.',lessons:[]}))];
const lessonContent={
'UX-001':{title:'What UX is',anchor:'A coffee order can look perfect and still fail. Alex chooses a nearby branch, pays, and walks there. The order was sent elsewhere. Nothing is visually broken, but the person has lost time, money, and confidence.',core:'UX is the quality of a person’s whole attempt to make progress - not the quality of a screen in isolation. A product can be visually polished and still produce poor UX if the goal, action, system response, service, and outcome do not align.',thread:'Course thread: this lesson introduces goal, interface, service, and experience. The next lessons test whether that attempt is usable, appropriate to context, and supported by the service behind it.',senior:'Senior lens: translate a symptom into a system hypothesis. Ask whether the remedy belongs in the interface, operating model, data, or policy.'},
'UX-007':{title:'Your brain does not see everything',anchor:'A travel app puts a time-sensitive gate change in a slim banner above a large sale card. The information is present. Many passengers still miss it.',core:'Perception is selective and expectation-led. People do not inspect every pixel; they notice a subset guided by their goal, prior knowledge, attention, contrast, motion, and expectation. Important information must be in the task path, distinguishable, understandable, and timed to change the next action.',thread:'Course thread: UX-001 defined the experience attempt. This lesson explains why a correct response can still fail to become part of it. UX-008 will make the intended information easier to perceive.',senior:'Senior lens: diagnose “nobody noticed it.” Was it outside the task path, visually similar to low-value content, mistimed, or competing with too many other signals?'} };
let current=modules[0];function renderModules(){modules.forEach(m=>{let e=document.createElement('article');e.className='module '+(m.lessons.length?'active':'');e.innerHTML=`<small>${m.id}</small><h3>${m.name}</h3><p>${m.desc}</p>`;let b=document.createElement('button');b.textContent=m.lessons.length?'Open module →':'Coming soon';b.disabled=!m.lessons.length;b.onclick=()=>{current=m;renderPlayer()};e.append(b);modulesEl.append(e)})}const modulesEl=document.querySelector('#modules');function renderPlayer(){document.querySelector('#moduleTitle').textContent=current.id+' - '+current.name;let list=document.querySelector('#lessonList');list.innerHTML='';current.lessons.forEach(([id,title],i)=>{let b=document.createElement('button');b.className='lesson-link';b.textContent=id+' · '+title;b.onclick=()=>show(id,b);list.append(b);if(!i)show(id,b)});}function show(id,button){document.querySelectorAll('.lesson-link').forEach(x=>x.classList.remove('active'));button.classList.add('active');let d=lessonContent[id]||{title:id,anchor:'This complete lesson is in the authoring pipeline.',core:'The course player is ready for this module. The full source-grounded chapter will appear here as its production pass is completed.',thread:'Course thread: every lesson states what it builds on and what it unlocks next.',senior:'Senior lens: connect the concept to product, system, and organisational trade-offs.'};document.querySelector('#content').innerHTML=`<div class="eyebrow">${current.id} · Lesson ${id}</div><h1>${d.title}</h1><section class="anchor"><strong>Anchor case</strong><br>${d.anchor}</section><h2>Core lesson</h2><p>${d.core}</p><section class="thread">${d.thread}</section><section class="senior"><div class="eyebrow">Senior lens</div><p>${d.senior}</p></section><h2>Train your UX eye</h2><p>Pause in a real product and identify where this concept changes the experience. Record what you observe and what evidence would confirm your interpretation.</p>`}renderModules();renderPlayer();
</script></body></html>
